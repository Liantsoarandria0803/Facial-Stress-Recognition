<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stress Detection</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            overflow: hidden;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            animation: fadeOut 2s ease-in-out 5s forwards;
        }

        .loading-screen h1 {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        .loading-screen h2 {
            margin-top: 10px;
            font-size: 28px;
        }

        .loading-screen p {
            font-size: 18px;
            margin-top: 10px;
        }

        .loading-dots::after {
            content: "";
            display: inline-block;
            animation: dots 1.5s infinite steps(3);
        }

        @keyframes dots {
            0% { content: "."; }
            33% { content: ".."; }
            66% { content: "..."; }
        }

        /* Main Content */
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            display: none;
        }

        video {
            width: 320px;
            height: 240px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background: #ff6b6b;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff4f4f;
            transform: scale(1.05);
        }

        .result-box {
            margin-top: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: inline-block;
        }

        .confidence {
            font-weight: bold;
            color: yellow;
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="loading-screen">
        <div>
            <h1>RANDRIA INDUSTRIES</h1>
            <h2>Stress Detection via Camera</h2>
            <p class="loading-dots">Initializing camera</p>
        </div>
    </div>
    
    <h2>Stress Detection via Camera</h2>
    <div class="container" id="main-content">
        <video id="video" autoplay></video>
        <button onclick="captureFrame()">Capture & Predict</button>
        <div id="result" class="result-box"></div>
    </div>
    
    <canvas id="canvas" width="224" height="224"></canvas>
    
    <script>
        setTimeout(() => {
            document.querySelector('.loading-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }, 5000);
        
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const context = canvas.getContext("2d");

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error("Error accessing webcam:", err);
            });

        function captureFrame() {
            context.drawImage(video, 0, 0, 224, 224);
            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append("file", blob, "capture.jpg");

                fetch("http://127.0.0.1:8000/predict/", {
                    method: "POST",
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById("result").innerHTML =
                        data.error ? `<p style="color:red;">Error: ${data.error}</p>` :
                        `<p>Prediction: <strong>${data.prediction}</strong></p>
                        <p class="confidence">Stress probability: ${(data.confidence * 100).toFixed(2)}%</p>`;
                })
                .catch(error => {
                    console.error("Error:", error);
                    document.getElementById("result").innerHTML = `<p style="color:red;">Error: ${error}</p>`;
                });
            }, "image/jpeg");
        }
    </script>
</body>
</html>
